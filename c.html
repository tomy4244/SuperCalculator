<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>超市计算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Prevent ANY element from creating horizontal scroll at the root */
    html { overflow: hidden; max-width: 100vw; }

    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Helvetica Neue", sans-serif;
      color: #fff;
      overflow: hidden;   /* stronger than overflow-x for Android WebView */
      max-width: 100vw;
    }

    .calculator {
      width: min(100%, 420px);
      max-width: 100%;      /* grid item: can't exceed body width */
      min-width: 0;         /* grid item: allow shrinking below min-content */
      background: #000;
      padding: 16px;
      overflow: hidden;     /* block children from expanding this container */
    }

    /* ── Mode Switch ── */
    .mode-switch {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 28px;
      margin-bottom: 8px;
      background: transparent;
      border-radius: 0;
      padding: 8px 0 0;
      flex-shrink: 0;
    }
    .mode-btn {
      border: none;
      border-radius: 0;
      aspect-ratio: unset;
      width: auto;
      min-height: unset;
      background: transparent;
      color: rgba(255,255,255,0.38);
      font-size: 23px; font-weight: 600;
      cursor: pointer; line-height: 1;
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      padding: 0 0 6px;
      border-bottom: 2.5px solid transparent;
    }
    .mode-btn.active {
      background: transparent;
      color: #fff;
      font-size: 30px;
      font-weight: 600;
      border-bottom-color: #ff9500;
    }
    .mode-btn:not(.active):active { background: transparent; opacity: 0.7; }

    /* ── Settings button ── */
    .settings-btn {
      margin-left: auto;
      flex-shrink: 0;
      background: transparent !important;
      border: none;
      border-radius: 50%;
      aspect-ratio: unset;
      width: 36px !important;
      height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.45);
      padding: 0 0 6px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .settings-btn:active { opacity: 0.55; }

    /* ── Settings overlay ── */
    .settings-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: #000;
      display: flex; flex-direction: column;
      padding: 52px 20px 24px;
    }
    .settings-overlay.hidden { display: none !important; }
    .settings-hdr {
      display: flex; align-items: center;
      gap: 6px;
      margin-bottom: 24px;
    }
    .settings-hdr-title {
      font-size: 20px; font-weight: 600; color: #fff;
    }
    .settings-back-btn {
      background: transparent !important;
      border: none; border-radius: 0;
      aspect-ratio: unset !important;
      width: auto !important; height: auto;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff;
      padding: 4px 10px 4px 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .settings-back-btn:active { opacity: 0.55; }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 16px; color: #fff;
    }
    .settings-row-val { color: rgba(255,255,255,0.4); font-size: 16px; }

    /* ── Display ── */
    .display {
      background: #000;
      padding: 4px 6px 12px;
      min-height: 100px;
      display: flex; flex-direction: column;
      justify-content: flex-end; gap: 2px;
      overflow: hidden; flex-shrink: 0;
      width: 100%; max-width: 100%; min-width: 0;
    }
    .history {
      text-align: right; color: rgba(255,255,255,0.38);
      font-size: 14px; font-weight: 400;
      min-height: 18px; white-space: nowrap; overflow: hidden;
      min-width: 0; width: 100%;
    }
    .current {
      text-align: right; font-size: 68px; font-weight: 300;
      line-height: 1.05; white-space: nowrap; overflow: hidden;
      min-width: 0; width: 100%; max-width: 100%; color: #fff;
    }

    /* ── Calc mode display: expression = primary, result = secondary ── */
    /* ── Market mode display ── */
    .calculator[data-mode="market"] .current {
      font-size: 60px; font-weight: 500; color: #fff;
    }

    /* Input mode: expression = active (large white), result = secondary (small gray) */
    .calculator[data-mode="calc"] .history {
      font-size: 60px; font-weight: 500; color: #fff; min-height: 0;
      transition: color 200ms ease, font-weight 200ms ease;
      scrollbar-width: none;          /* Firefox */
    }
    .calculator[data-mode="calc"] .history::-webkit-scrollbar { display: none; }
    .hist-cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;          /* 115% of font-size: extends ~7.5% above & below digit */
      background: #ff9500;
      border-radius: 1px;
      animation: hist-blink 1s step-end infinite;
      vertical-align: -0.22em; /* shift down so cursor is centered on cap-height digits */
      margin: 0 1px;
    }
    @keyframes hist-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .calculator[data-mode="calc"] .current {
      font-size: 35px; font-weight: 400; color: #888;
      transition: font-size 200ms ease, color 200ms ease, font-weight 200ms ease;
    }
    /* Result mode: result = active (large white), expression = secondary (small gray) */
    .calculator[data-mode="calc"].result-mode .history {
      font-size: 34px; font-weight: 300; color: #888;
    }
    .calculator[data-mode="calc"].result-mode .current {
      font-size: 60px; font-weight: 500; color: #fff;
    }

    .hidden { display: none !important; }

    /* ── ALL BUTTONS: circular base ── */
    button {
      border: none;
      border-radius: 50%;
      aspect-ratio: 1;
      width: 100%;
      font-size: 26px; font-weight: 400;
      color: #fff;
      background: #333;
      cursor: pointer;
      transition: opacity .08s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      min-height: 0; min-width: 0;
      line-height: 1;
    }
    button:active { opacity: 0.6; }

    /* ── Calc Keys Grid ── */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%; min-width: 0;
    }

    /* ── Calc panel: scaled buttons + shift down ── */
    /* ── Calc icon row (above MC buttons) ── */
    .calc-icons {
      display: none;
      justify-content: flex-start;
      gap: 18px;
      padding: 0 10px 8px;
      margin-top: 60px;   /* gap lives here: between display and icons */
    }
    .calculator[data-mode="calc"] .calc-icons { display: flex; }
    .icon-btn {
      background: transparent !important;
      border: none; border-radius: 50%;
      aspect-ratio: unset !important;
      width: 32px !important; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(255,255,255,0.35);
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .icon-btn:active { opacity: 0.6; }

    #normalPanel {
      gap: 15px 23px;
      padding: 8px 14px;
      margin-top: 0;
    }
    #normalPanel button        { font-size: 57px; font-weight: 500; }
    #normalPanel [data-value="."] { font-size: 33px; }
    #normalPanel .mem-btn      { font-size: 19px !important; font-weight: 600 !important; }
    #normalPanel .danger       { font-size: 20px !important; font-weight: 500 !important; }
    #normalPanel [data-action="delete"] { font-size: 22px; font-weight: 400; }
    #normalPanel [data-value="%"]       { font-size: 26px; font-weight: 600; }
    #normalPanel .operator     { font-size: 32px !important; font-weight: 500 !important; }
    #normalPanel .equals       { font-size: 32px !important; font-weight: 600 !important; }

    /* Memory row — very dark small circles */
    .mem-btn {
      background: #1c1c1e !important;
      color: rgba(255,255,255,0.5) !important;
      font-size: 13px !important; font-weight: 700;
    }
    .mem-btn.has-mem { color: #ff9500 !important; }

    /* Function buttons: AC (danger), backspace, ± — light gray */
    .danger {
      background: #a5a5a5 !important;
      color: #000 !important;
      font-size: 22px !important; font-weight: 600 !important;
    }
    [data-action="delete"] { background: #a5a5a5; color: #000; font-size: 24px; }
    [data-action="sign"]   { background: #a5a5a5; color: #000; font-size: 26px; }

    /* % key in calc panel — also function gray */
    .keys [data-value="%"] { background: #a5a5a5; color: #000; font-size: 24px; }

    /* Operators — orange */
    .operator {
      background: #ff9500 !important;
      color: #fff !important;
      font-size: 30px !important; font-weight: 300 !important;
    }

    /* Equals — orange */
    .equals {
      background: #ff9500 !important;
      color: #fff !important;
      font-size: 30px !important;
    }

    /* ── Market Panel ── */
    .market-panel {
      display: flex; flex-direction: column;
      gap: 6px; width: 100%; min-width: 0;
    }

    .market-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%; min-width: 0;
    }

    .market-field { display: flex; flex-direction: column; gap: 2px; }

    .market-field label {
      font-size: 14px; color: rgba(255,255,255,0.38); font-weight: 500;
      display: flex; align-items: center; gap: 4px;
      letter-spacing: 0.3px; padding: 0 2px;
    }

    .panel-input {
      width: 100%; height: 46px; min-height: 46px; min-width: 0;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: #888;
      border-radius: 0; padding: 4px 2px;
      font-size: 30px; font-weight: 400; outline: none;
      /* Lock font — prevent Android WebView input auto-shrink */
      -webkit-text-size-adjust: 100%;
      caret-color: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      text-align: right;
    }
    .panel-input.field-active { border-bottom-color: #ff9500; }
    .panel-input::placeholder { color: rgba(255,255,255,0.18); font-size: 13px; }

    /* Tooltip */
    .tooltip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.12); font-size: 10px;
      cursor: help; position: relative;
    }
    .tooltip::after {
      content: attr(data-tip);
      position: absolute; left: 50%; bottom: calc(100% + 6px);
      transform: translateX(-50%); width: 150px;
      padding: 6px 8px; border-radius: 8px; background: #1c1c1e;
      color: #fff; font-size: 11px; line-height: 1.4;
      border: 1px solid rgba(255,255,255,0.08); opacity: 0;
      pointer-events: none; transition: opacity .15s;
      z-index: 10; text-align: left; white-space: normal;
    }
    .tooltip:active::after { opacity: 1; }

    /* ── Market Bottom Row (AC / 全部清除) ── */
    .pad-bottom {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pad-bottom button {
      border-radius: 14px !important;
      aspect-ratio: unset !important;
      min-height: 48px;
      font-size: 17px !important; font-weight: 600 !important;
    }
    .pad-ac-btn  { background: #dc2626 !important; color: #fff !important; }
    .pad-clr-btn { background: #374151 !important; color: #fff !important; }

    /* ── Market Number Pad ── */
    .num-pad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    /* Market numpad: v1 sizes, calc-page colors */
    .num-pad button {
      font-size: 20px; font-weight: 400;
      border-radius: 14px;
      aspect-ratio: unset;
      min-height: 52px;
      background: #333;
    }
    .pad-del { background: #333 !important; color: #fff !important; font-size: 22px !important; }

    /* ── Rate Panel ── */
    .rate-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .rate-frame-wrap {
      flex: 1; min-height: 420px; position: relative;
      border-radius: 14px; overflow: hidden; background: #fff;
    }
    #rateIframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; }
    .rate-loading {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #1c1c1e; color: rgba(255,255,255,0.5); font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ff9500; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rate-error {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #1c1c1e; padding: 24px; text-align: center;
    }
    .rate-error p { color: rgba(255,255,255,0.5); font-size: 14px; line-height: 1.6; }
    .open-browser-btn {
      background: #ff9500 !important; color: #fff !important;
      border: none; border-radius: 14px !important;
      aspect-ratio: unset !important; width: auto !important;
      padding: 14px 28px; font-size: 17px; font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .open-browser-btn:active { opacity: 0.7; }

    /* ── Mobile: full screen ── */
    @media (max-width: 480px) {
      body { padding: 0; place-items: start stretch; }

      .calculator {
        width: 100%;
        max-width: 100vw;         /* never exceed viewport width */
        min-height: 100vh; min-height: 100dvh;
        border-radius: 0; border: none;
        padding: 12px 14px 20px;
        display: flex; flex-direction: column;
        overflow: hidden;         /* flex container: block children from expanding */
      }

      .mode-switch { flex-shrink: 0; }

      /* Calc mode: display grows, keys sit naturally at bottom */
      .display { min-height: 80px; padding: 4px 4px 8px; }
      .calculator[data-mode="calc"] .display { flex: 1; }
      .current { font-size: 76px; }
      .calculator[data-mode="calc"] .history { font-size: 50px; }
      .calculator[data-mode="calc"] .current { font-size: 32px; }


      /* Calc keys: natural-height circles (no stretching) */
      .keys { flex-shrink: 0; gap: 11px; }
      .calc-icons { margin-top: 52px; }
      #normalPanel { gap: 13px 21px !important; padding: 7px 12px; margin-top: 0; }
      #normalPanel button { font-size: 50px; font-weight: 500; }
      #normalPanel [data-value="."] { font-size: 29px; }
      .calculator[data-mode="calc"].result-mode .history { font-size: 30px; }
      .calculator[data-mode="calc"].result-mode .current { font-size: 54px; }

      /* Market mode: display fixed height — prevents fitDisplay() font changes
         from altering layout and shifting buttons below */
      .calculator[data-mode="market"] .display {
        flex: none;
        height: 120px;        /* fixed — never grows or shrinks */
        min-height: 0;
        overflow: hidden;
      }
      .market-panel {
        flex: 1; min-height: 0;
        overflow: hidden;
        gap: 6px;
      }
      .market-row { flex-shrink: 0; }
      /* Fixed height on inputs — prevents Android WebView input font-shrink
         from changing element height and shifting the numpad */
      .panel-input { height: 46px; min-height: 46px; font-size: 30px; font-weight: 400; color: #888; }
      .calculator[data-mode="market"] .current { font-size: 60px; font-weight: 500; }
      /* Numpad grows to fill remaining space; rounded-rect buttons fill each cell */
      #marketNumPad {
        flex: 1; min-height: 0;
        grid-template-rows: repeat(4, 1fr);
        align-items: stretch; justify-items: stretch;
        gap: 8px;
      }
      /* Rounded rectangle: fill cell width & height, no aspect-ratio lock */
      #marketNumPad button {
        width: 100%; height: 100%;
        aspect-ratio: unset;
        border-radius: 14px;
        background: #333;
        max-width: none;
      }
      #marketPadBottom { flex-shrink: 0; gap: 8px; }
      .pad-bottom button { min-height: 48px; }

      .rate-panel { flex: 1; min-height: 0; }
      .rate-frame-wrap { flex: 1; min-height: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="calculator">

    <!-- Mode Switch -->
    <section class="mode-switch">
      <button class="mode-btn active" id="calcModeBtn"   type="button">计算</button>
      <button class="mode-btn"        id="marketModeBtn" type="button">超市</button>
      <button class="mode-btn"        id="rateModeBtn"   type="button">汇率</button>
      <button class="settings-btn" id="settingsBtn" type="button" aria-label="设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </section>

    <!-- Display (hidden in rate mode) -->
    <section class="display" id="displaySection">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </section>

    <!-- Calc icon row -->
    <div class="calc-icons">
      <button class="icon-btn" type="button" aria-label="历史记录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 6 12 12 15.5 14"/>
        </svg>
      </button>
      <button class="icon-btn" type="button" aria-label="计算记录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <line x1="8" y1="8" x2="16" y2="8"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="8" y1="16" x2="13" y2="16"/>
        </svg>
      </button>
    </div>

    <!-- Calculator Panel -->
    <section class="keys hidden" id="normalPanel">
      <!-- Row 1: Memory -->
      <button class="mem-btn" data-action="mc">MC</button>
      <button class="mem-btn" data-action="mplus">M+</button>
      <button class="mem-btn" data-action="mminus">M−</button>
      <button class="mem-btn" data-action="mr">MR</button>

      <!-- Row 2 -->
      <button class="danger" data-action="clear">AC</button>
      <button data-action="delete">⌫</button>
      <button data-action="sign" style="font-size:21px;font-weight:600;">+/−</button>
      <button class="operator" data-value="/">÷</button>

      <!-- Row 3 -->
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <!-- Row 4 -->
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <!-- Row 5 -->
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <!-- Row 6 -->
      <button data-value="%">%</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>

    <!-- Market Panel -->
    <section class="market-panel hidden" id="marketPanel">
      <div class="market-row">
        <div class="market-field" style="grid-column:1/-1">
          <label for="mInputA">进价</label>
          <input class="panel-input" id="mInputA" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <div class="market-row">
        <div class="market-field">
          <label for="mInputB">IVA税 %</label>
          <input class="panel-input" id="mInputB" readonly inputmode="none" placeholder="点此输入" />
        </div>
        <div class="market-field">
          <label for="mInputProfit">利润 %</label>
          <input class="panel-input" id="mInputProfit" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <div class="market-row">
        <div class="market-field">
          <label for="mInputD1">折扣1 %</label>
          <input class="panel-input" id="mInputD1" readonly inputmode="none" placeholder="点此输入" />
        </div>
        <div class="market-field">
          <label for="mInputD2">折扣2 %</label>
          <input class="panel-input" id="mInputD2" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <!-- AC + 全部清除 -->
      <div class="pad-bottom" id="marketPadBottom">
        <button class="pad-ac-btn"  data-pad="ac">AC</button>
        <button class="pad-clr-btn" data-pad="clear-all">全部清除</button>
      </div>

      <!-- Number pad -->
      <div class="num-pad" id="marketNumPad">
        <button data-pad="7">7</button>
        <button data-pad="8">8</button>
        <button data-pad="9">9</button>

        <button data-pad="4">4</button>
        <button data-pad="5">5</button>
        <button data-pad="6">6</button>

        <button data-pad="1">1</button>
        <button data-pad="2">2</button>
        <button data-pad="3">3</button>

        <button data-pad=".">.</button>
        <button data-pad="0">0</button>
        <button class="pad-del" data-pad="del">⌫</button>
      </div>
    </section>

    <!-- Rate Panel -->
    <section class="rate-panel hidden" id="ratePanel">
      <div class="rate-frame-wrap">
        <div class="rate-loading" id="rateLoading">
          <div class="spinner"></div>
          <span>加载中...</span>
        </div>
        <div class="rate-error hidden" id="rateError">
          <p>该页面不允许嵌入显示。<br>请点击下方按钮在浏览器中查看。</p>
          <button class="open-browser-btn" id="openBrowserBtn">打开汇率页面</button>
        </div>
        <iframe id="rateIframe"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
      </div>
    </section>

  </main>

  <!-- Settings overlay -->
  <div class="settings-overlay hidden" id="settingsOverlay">
    <div class="settings-hdr">
      <button class="settings-back-btn" id="settingsCloseBtn" type="button" aria-label="返回">
        <svg width="10" height="18" viewBox="0 0 10 18" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 1 1 9 9 17"/>
        </svg>
      </button>
      <span class="settings-hdr-title">设置</span>
    </div>
    <div class="settings-row">
      <span>版本号</span>
      <span class="settings-row-val">V01</span>
    </div>
  </div>

  <script>
    const RATE_URL = 'https://www.cronista.com/MercadosOnline/moneda/ARSB/';

    const calcEl        = document.querySelector('.calculator');
    const displaySection = document.getElementById('displaySection');
    const displayEl      = document.getElementById('display');
    const historyEl      = document.getElementById('history');
    const normalPanel    = document.getElementById('normalPanel');
    const marketPanel    = document.getElementById('marketPanel');
    const ratePanel      = document.getElementById('ratePanel');
    const calcModeBtn    = document.getElementById('calcModeBtn');
    const marketModeBtn  = document.getElementById('marketModeBtn');
    const rateModeBtn    = document.getElementById('rateModeBtn');
    const rateIframe     = document.getElementById('rateIframe');
    const rateLoading    = document.getElementById('rateLoading');
    const rateError      = document.getElementById('rateError');

    const mInputA      = document.getElementById('mInputA');
    const mInputB      = document.getElementById('mInputB');
    const mInputProfit = document.getElementById('mInputProfit');
    const mInputD1     = document.getElementById('mInputD1');
    const mInputD2     = document.getElementById('mInputD2');
    const marketInputs = [mInputA, mInputB, mInputProfit, mInputD1, mInputD2];

    let currentMode = 'calc';
    let expression  = '';
    let justCalcd   = false;
    let activeInput = null;
    let cursorPos   = -1;   // -1 = end; ≥0 = explicit position in expression
    let rateLoaded  = false;
    let memory      = 0;
    let hasMemory   = false;

    function fmt(v) {
      if (!Number.isFinite(v)) return 'Error';
      // toPrecision(10) eliminates float noise (e.g. 7357.5000000000007 → 7357.5)
      return String(parseFloat(v.toPrecision(10)));
    }
    function evalExpr() {
      if (!expression) return 0;
      try {
        const r = Function('"use strict";return(' + fixPct(expression) + ')')();
        return Number.isFinite(r) ? r : 0;
      } catch { return 0; }
    }
    function toDisplayExpr(expr) {
      return expr.replace(/\*/g, '×').replace(/\//g, '÷');
    }
    function liveCalc(expr) {
      if (!expr) return '0';
      const clean = expr.replace(/[+\-*/]+$/, '');
      if (!clean) return '0';
      try {
        const r = Function('"use strict";return(' + fixPct(clean) + ')')();
        return Number.isFinite(r) ? fmt(r) : '0';
      } catch { return '0'; }
    }
    function updateMemVisual() {
      document.querySelectorAll('.mem-btn').forEach(b => {
        b.classList.toggle('has-mem', hasMemory);
      });
    }
    function parseField(el) {
      const s = el.value.trim();
      if (!s) return 0;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    /* Auto-shrink display font so numbers never break layout */
    function fitDisplay() {
      displayEl.style.fontSize = '';
      if (displayEl.scrollWidth <= displayEl.clientWidth) return;
      const fs = parseFloat(getComputedStyle(displayEl).fontSize);
      const newFs = Math.max(14, fs * displayEl.clientWidth / displayEl.scrollWidth);
      displayEl.style.fontSize = newFs + 'px';
    }
    const MIN_HIST_FS = 40;
    function fitHistory() {
      if (!historyEl.textContent) {
        historyEl.style.fontSize = '';
        historyEl.style.overflowX = '';
        return;
      }
      // Reset to CSS max so we can measure and allow font to grow back
      historyEl.style.overflowX = 'hidden';
      historyEl.style.fontSize = '';
      if (historyEl.scrollWidth <= historyEl.clientWidth) return; // fits at max — done
      const maxFs  = parseFloat(getComputedStyle(historyEl).fontSize);
      const idealFs = maxFs * historyEl.clientWidth / historyEl.scrollWidth;
      if (idealFs >= MIN_HIST_FS) {
        historyEl.style.fontSize = idealFs + 'px';
      } else {
        // At minimum — stop shrinking, enable horizontal scroll
        historyEl.style.fontSize = MIN_HIST_FS + 'px';
        historyEl.style.overflowX = 'auto';
        requestAnimationFrame(() => {
          if (cursorPos < 0) historyEl.scrollLeft = historyEl.scrollWidth;
        });
      }
    }
    function setDisplay(text) {
      displayEl.textContent = text;
      fitDisplay();
    }

    function setMode(mode) {
      currentMode = mode;
      calcEl.dataset.mode = mode;
      calcEl.classList.remove('result-mode');
      cursorPos = -1;
      calcModeBtn  .classList.toggle('active', mode === 'calc');
      marketModeBtn.classList.toggle('active', mode === 'market');
      rateModeBtn  .classList.toggle('active', mode === 'rate');
      normalPanel.classList.toggle('hidden', mode !== 'calc');
      marketPanel.classList.toggle('hidden', mode !== 'market');
      ratePanel  .classList.toggle('hidden', mode !== 'rate');
      displaySection.classList.toggle('hidden', mode === 'rate');

      if (mode === 'calc') {
        activeInput = null;
        updateDisplay();
      } else if (mode === 'market') {
        historyEl.textContent = '';
        setDisplay('0');
        setActiveInput(mInputA);
        recalcMarket();
      } else {
        if (!rateLoaded) {
          rateLoaded = true;
          rateIframe.src = RATE_URL;
          setTimeout(() => {
            if (!rateLoading.classList.contains('hidden')) {
              rateLoading.classList.add('hidden');
              rateError.classList.remove('hidden');
            }
          }, 18000);
        }
      }
    }

    function setActiveInput(el) {
      document.querySelectorAll('.panel-input').forEach(i => i.classList.remove('field-active'));
      activeInput = el;
      if (el) el.classList.add('field-active');
    }

    function padPress(key) {
      if (key === 'ac') {
        if (activeInput) activeInput.value = '';
        recalcMarket();
        return;
      }
      if (key === 'clear-all') {
        marketInputs.forEach(i => i.value = '');
        setActiveInput(mInputA);
        recalcMarket();
        return;
      }
      if (!activeInput) return;
      const cur = activeInput.value;
      if (key === 'del') {
        activeInput.value = cur.slice(0, -1);
      } else if (key === '.') {
        if (cur === '' || cur === '0') return;
        if (!cur.includes('.')) activeInput.value = cur + '.';
      } else {
        activeInput.value = (cur === '0') ? key : cur + key;
      }
      recalcMarket();
    }

    function updateDisplay() {
      const disp = toDisplayExpr(expression);
      const inResult = calcEl.classList.contains('result-mode');
      if (cursorPos >= 0 && !inResult) {
        const b = disp.slice(0, cursorPos);
        const a = disp.slice(cursorPos);
        historyEl.innerHTML = b + '<span class="hist-cursor"></span>' + a;
      } else {
        historyEl.textContent = disp;
      }
      fitHistory();
      setDisplay(liveCalc(expression));
    }

    function appendValue(v) {
      calcEl.classList.remove('result-mode');
      if (justCalcd && /[0-9.]/.test(v)) { expression = ''; cursorPos = -1; }
      justCalcd = false;
      const pos  = cursorPos < 0 ? expression.length : cursorPos;
      const last = pos > 0 ? expression[pos - 1] : '';
      const ops  = ['+', '-', '*', '/', '%'];
      if (ops.includes(v)) {
        if (!expression && v !== '-') return;
        if (v === '%') {
          if (!/\d/.test(last) || last === '%') return;
          expression = expression.slice(0, pos) + v + expression.slice(pos);
          if (cursorPos >= 0) cursorPos = pos + 1;
          updateDisplay(); return;
        }
        if (ops.includes(last) && last !== '%') {
          expression = expression.slice(0, pos - 1) + v + expression.slice(pos);
          // cursor stays at pos (replaced char before it)
        } else {
          expression = expression.slice(0, pos) + v + expression.slice(pos);
          if (cursorPos >= 0) cursorPos = pos + 1;
        }
        updateDisplay(); return;
      }
      if (v === '.') {
        const chunk = expression.slice(0, pos).split(/[+\-*/%]/).pop();
        if (chunk.includes('.') || chunk === '') return;
        expression = expression.slice(0, pos) + '.' + expression.slice(pos);
        if (cursorPos >= 0) cursorPos = pos + 1;
        updateDisplay(); return;
      }
      expression = expression.slice(0, pos) + v + expression.slice(pos);
      if (cursorPos >= 0) cursorPos = pos + 1;
      updateDisplay();
    }

    function clearAll() {
      expression = '';
      cursorPos = -1;
      historyEl.textContent = '';
      historyEl.style.fontSize = '';
      historyEl.style.overflowX = '';
      justCalcd = false;
      calcEl.classList.remove('result-mode');
      setDisplay('0');
    }
    function deleteOne() {
      if (justCalcd) { clearAll(); return; }
      const pos = cursorPos < 0 ? expression.length : cursorPos;
      if (pos === 0) return;
      expression = expression.slice(0, pos - 1) + expression.slice(pos);
      if (cursorPos >= 0) cursorPos = pos - 1;
      updateDisplay();
    }
    function toggleSign() {
      cursorPos = -1;
      if (!expression) return;
      const m = expression.match(/(-?\d*\.?\d+)%?$/);
      if (!m) return;
      const full = m[0], hasPct = full.endsWith('%');
      const num  = hasPct ? full.slice(0, -1) : full;
      const tog  = num.startsWith('-') ? num.slice(1) : '-' + num;
      expression = expression.slice(0, m.index) + tog + (hasPct ? '%' : '');
      updateDisplay();
    }
    function fixPct(e) {
      let s = e;
      s = s.replace(/(\d+(?:\.\d+)?)\+(\d+(?:\.\d+)?)%/g, '($1*(1+$2/100))');
      s = s.replace(/(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)%/g,  '($1*(1-$2/100))');
      s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
      return s;
    }
    function calculate() {
      if (!expression) return;
      if (justCalcd) return;
      try {
        const r = Function('"use strict";return(' + fixPct(expression) + ')')();
        if (!Number.isFinite(r)) throw 0;
        const lastExpr = toDisplayExpr(expression);
        expression = fmt(r);
        cursorPos  = -1;
        justCalcd  = true;
        historyEl.textContent = lastExpr;
        historyEl.style.fontSize = '';
        fitHistory();
        setDisplay(expression);
        calcEl.classList.add('result-mode');   // focus shifts to result
      } catch {
        historyEl.textContent = '计算错误';
        setDisplay('Error');
        expression = ''; justCalcd = false;
        calcEl.classList.remove('result-mode');
      }
    }

    function recalcMarket() {
      if (!mInputA.value.trim()) {
        historyEl.textContent = ''; setDisplay('0'); return;
      }
      const a   = parseField(mInputA);
      const iva = parseField(mInputB);
      const pft = parseField(mInputProfit);
      const d1  = parseField(mInputD1);
      const d2  = parseField(mInputD2);
      if ([a, iva, pft, d1, d2].some(Number.isNaN)) { setDisplay('Error'); return; }
      const r = a * (1 - d1 / 100) * (1 - d2 / 100) * (1 + iva / 100) * (1 + pft / 100);
      historyEl.textContent = '';
      setDisplay(fmt(r));
    }

    rateIframe.addEventListener('load',  () => rateLoading.classList.add('hidden'));
    rateIframe.addEventListener('error', () => {
      rateLoading.classList.add('hidden');
      rateError.classList.remove('hidden');
    });
    document.getElementById('openBrowserBtn').addEventListener('click', () => {
      if (window.AndroidBridge) {
        window.AndroidBridge.openUrl(RATE_URL);
      } else {
        window.open(RATE_URL, '_blank');
      }
    });

    document.getElementById('normalPanel').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const { value: v, action: a } = b.dataset;
      if (v) appendValue(v);
      if (a === 'clear')  clearAll();
      if (a === 'delete') deleteOne();
      if (a === 'sign')   toggleSign();
      if (a === 'equals') calculate();
      if (a === 'mc')     { memory = 0; hasMemory = false; updateMemVisual(); }
      if (a === 'mplus')  { memory += evalExpr(); hasMemory = true; updateMemVisual(); }
      if (a === 'mminus') { memory -= evalExpr(); hasMemory = true; updateMemVisual(); }
      if (a === 'mr')     { if (hasMemory) { expression = fmt(memory); justCalcd = true; updateDisplay(); } }
    });

    ['marketNumPad', 'marketPadBottom'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        const b = e.target.closest('button[data-pad]');
        if (b) padPress(b.dataset.pad);
      });
    });

    marketInputs.forEach(inp => {
      inp.addEventListener('click',    ()  => setActiveInput(inp));
      inp.addEventListener('touchend', e  => { e.preventDefault(); setActiveInput(inp); });
    });

    // Click on expression to position cursor
    historyEl.addEventListener('click', e => {
      if (currentMode !== 'calc' || justCalcd ||
          calcEl.classList.contains('result-mode') || !expression) return;
      let pos = expression.length;
      const range = document.caretRangeFromPoint
        ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
      if (range && range.startContainer.nodeType === Node.TEXT_NODE) {
        const node = range.startContainer;
        let before = 0;
        for (const child of historyEl.childNodes) {
          if (child === node) break;
          if (child.nodeType === Node.TEXT_NODE) before += child.textContent.length;
        }
        pos = Math.min(before + range.startOffset, expression.length);
      }
      cursorPos = pos;
      updateDisplay();
    });

    calcModeBtn  .addEventListener('click', () => setMode('calc'));
    marketModeBtn.addEventListener('click', () => setMode('market'));
    // Rate tab: single tap = switch, double tap = reload WebView
    let rateTabLastTap = 0;
    rateModeBtn.addEventListener('click', () => {
      const now = Date.now();
      if (currentMode === 'rate' && now - rateTabLastTap < 500) {
        rateLoading.classList.remove('hidden');
        rateError.classList.add('hidden');
        rateIframe.src = RATE_URL;
      } else {
        setMode('rate');
      }
      rateTabLastTap = now;
    });

    window.addEventListener('keydown', e => {
      if (currentMode !== 'calc') return;
      const k = e.key;
      if (/^[0-9]$/.test(k)) appendValue(k);
      else if (['+', '-', '*', '/', '%', '.'].includes(k)) appendValue(k);
      else if (k === 'Enter' || k === '=') calculate();
      else if (k === 'Backspace') deleteOne();
      else if (k === 'Escape')    clearAll();
    });

    setMode('calc');

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsOverlay').classList.remove('hidden');
    });
    document.getElementById('settingsCloseBtn').addEventListener('click', () => {
      document.getElementById('settingsOverlay').classList.add('hidden');
    });
  </script>
</body>
</html>
