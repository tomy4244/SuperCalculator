<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>超市计算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Prevent ANY element from creating horizontal scroll at the root */
    html { overflow: hidden; max-width: 100vw; }

    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Helvetica Neue", sans-serif;
      color: #fff;
      overflow: hidden;   /* stronger than overflow-x for Android WebView */
      max-width: 100vw;
    }

    .calculator {
      width: min(100%, 420px);
      max-width: 100%;      /* grid item: can't exceed body width */
      min-width: 0;         /* grid item: allow shrinking below min-content */
      background: #000;
      padding: 16px;
      overflow: hidden;     /* block children from expanding this container */
    }

    /* ── Mode Switch (segmented control) ── */
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 2px; margin-bottom: 8px;
      background: #1c1c1e;
      border-radius: 10px;
      padding: 3px;
      flex-shrink: 0;
    }
    .mode-btn {
      border: none;
      border-radius: 7px;
      aspect-ratio: unset;
      width: 100%;
      min-height: 36px;
      background: transparent;
      color: rgba(255,255,255,0.55);
      font-size: 15px; font-weight: 600;
      cursor: pointer; line-height: 1;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
    }
    .mode-btn.active { background: #636366; color: #fff; }
    .mode-btn:not(.active):active { background: rgba(255,255,255,0.08); }

    /* ── Display ── */
    .display {
      background: #000;
      padding: 4px 6px 12px;
      min-height: 100px;
      display: flex; flex-direction: column;
      justify-content: flex-end; gap: 2px;
      overflow: hidden; flex-shrink: 0;
      width: 100%; max-width: 100%; min-width: 0;
    }
    .history {
      text-align: right; color: rgba(255,255,255,0.38);
      font-size: 14px; font-weight: 400;
      min-height: 18px; white-space: nowrap; overflow: hidden;
      min-width: 0; width: 100%;
    }
    .current {
      text-align: right; font-size: 68px; font-weight: 300;
      line-height: 1.05; white-space: nowrap; overflow: hidden;
      min-width: 0; width: 100%; max-width: 100%; color: #fff;
    }

    .hidden { display: none !important; }

    /* ── ALL BUTTONS: circular base ── */
    button {
      border: none;
      border-radius: 50%;
      aspect-ratio: 1;
      width: 100%;
      font-size: 26px; font-weight: 400;
      color: #fff;
      background: #333;
      cursor: pointer;
      transition: opacity .08s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      min-height: 0; min-width: 0;
      line-height: 1;
    }
    button:active { opacity: 0.6; }

    /* ── Calc Keys Grid ── */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%; min-width: 0;
    }

    /* Memory row — very dark small circles */
    .mem-btn {
      background: #1c1c1e !important;
      color: rgba(255,255,255,0.5) !important;
      font-size: 13px !important; font-weight: 700;
    }
    .mem-btn.has-mem { color: #ff9500 !important; }

    /* Function buttons: AC (danger), backspace, ± — light gray */
    .danger {
      background: #a5a5a5 !important;
      color: #000 !important;
      font-size: 22px !important; font-weight: 600 !important;
    }
    [data-action="delete"] { background: #a5a5a5; color: #000; font-size: 24px; }
    [data-action="sign"]   { background: #a5a5a5; color: #000; font-size: 26px; }

    /* % key in calc panel — also function gray */
    .keys [data-value="%"] { background: #a5a5a5; color: #000; font-size: 24px; }

    /* Operators — orange */
    .operator {
      background: #ff9500 !important;
      color: #fff !important;
      font-size: 30px !important; font-weight: 300 !important;
    }

    /* Equals — orange */
    .equals {
      background: #ff9500 !important;
      color: #fff !important;
      font-size: 30px !important;
    }

    /* ── Market Panel ── */
    .market-panel {
      display: flex; flex-direction: column;
      gap: 6px; width: 100%; min-width: 0;
    }

    .market-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%; min-width: 0;
    }

    .market-field { display: flex; flex-direction: column; gap: 2px; }

    .market-field label {
      font-size: 14px; color: rgba(255,255,255,0.38); font-weight: 500;
      display: flex; align-items: center; gap: 4px;
      letter-spacing: 0.3px; padding: 0 2px;
    }

    .panel-input {
      width: 100%; height: 46px; min-height: 46px; min-width: 0;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: #fff;
      border-radius: 0; padding: 4px 2px;
      font-size: 23px; font-weight: 600; outline: none;
      /* Lock font — prevent Android WebView input auto-shrink */
      -webkit-text-size-adjust: 100%;
      caret-color: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      text-align: right;
    }
    .panel-input.field-active { border-bottom-color: #ff9500; }
    .panel-input::placeholder { color: rgba(255,255,255,0.18); font-size: 13px; }

    /* Tooltip */
    .tooltip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.12); font-size: 10px;
      cursor: help; position: relative;
    }
    .tooltip::after {
      content: attr(data-tip);
      position: absolute; left: 50%; bottom: calc(100% + 6px);
      transform: translateX(-50%); width: 150px;
      padding: 6px 8px; border-radius: 8px; background: #1c1c1e;
      color: #fff; font-size: 11px; line-height: 1.4;
      border: 1px solid rgba(255,255,255,0.08); opacity: 0;
      pointer-events: none; transition: opacity .15s;
      z-index: 10; text-align: left; white-space: normal;
    }
    .tooltip:active::after { opacity: 1; }

    /* ── Market Bottom Row (AC / 全部清除) ── */
    .pad-bottom {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pad-bottom button {
      border-radius: 14px !important;
      aspect-ratio: unset !important;
      min-height: 48px;
      font-size: 17px !important; font-weight: 600 !important;
    }
    .pad-ac-btn  { background: #dc2626 !important; color: #fff !important; }
    .pad-clr-btn { background: #374151 !important; color: #fff !important; }

    /* ── Market Number Pad ── */
    .num-pad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    /* Market numpad: v1 sizes, calc-page colors */
    .num-pad button {
      font-size: 20px; font-weight: 400;
      border-radius: 14px;
      aspect-ratio: unset;
      min-height: 52px;
      background: #333;
    }
    .pad-del { background: #333 !important; color: #fff !important; font-size: 22px !important; }

    /* ── Rate Panel ── */
    .rate-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .rate-frame-wrap {
      flex: 1; min-height: 420px; position: relative;
      border-radius: 14px; overflow: hidden; background: #fff;
    }
    #rateIframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; }
    .rate-loading {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #1c1c1e; color: rgba(255,255,255,0.5); font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ff9500; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rate-error {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #1c1c1e; padding: 24px; text-align: center;
    }
    .rate-error p { color: rgba(255,255,255,0.5); font-size: 14px; line-height: 1.6; }
    .open-browser-btn {
      background: #ff9500 !important; color: #fff !important;
      border: none; border-radius: 14px !important;
      aspect-ratio: unset !important; width: auto !important;
      padding: 14px 28px; font-size: 17px; font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .open-browser-btn:active { opacity: 0.7; }

    /* ── Mobile: full screen ── */
    @media (max-width: 480px) {
      body { padding: 0; place-items: start stretch; }

      .calculator {
        width: 100%;
        max-width: 100vw;         /* never exceed viewport width */
        min-height: 100vh; min-height: 100dvh;
        border-radius: 0; border: none;
        padding: 12px 14px 20px;
        display: flex; flex-direction: column;
        overflow: hidden;         /* flex container: block children from expanding */
      }

      .mode-switch { flex-shrink: 0; }

      /* Calc mode: display grows, keys sit naturally at bottom */
      .display { min-height: 80px; padding: 4px 4px 8px; }
      .calculator[data-mode="calc"] .display { flex: 1; }
      .current { font-size: 76px; }

      /* Calc keys: natural-height circles (no stretching) */
      .keys { flex-shrink: 0; gap: 11px; }

      /* Market mode: display fixed height — prevents fitDisplay() font changes
         from altering layout and shifting buttons below */
      .calculator[data-mode="market"] .display {
        flex: none;
        height: 120px;        /* fixed — never grows or shrinks */
        min-height: 0;
        overflow: hidden;
      }
      .market-panel {
        flex: 1; min-height: 0;
        overflow: hidden;
        gap: 6px;
      }
      .market-row { flex-shrink: 0; }
      /* Fixed height on inputs — prevents Android WebView input font-shrink
         from changing element height and shifting the numpad */
      .panel-input { height: 46px; min-height: 46px; font-size: 23px; font-weight: 600; }
      /* Numpad grows to fill remaining space; rounded-rect buttons fill each cell */
      #marketNumPad {
        flex: 1; min-height: 0;
        grid-template-rows: repeat(4, 1fr);
        align-items: stretch; justify-items: stretch;
        gap: 8px;
      }
      /* Rounded rectangle: fill cell width & height, no aspect-ratio lock */
      #marketNumPad button {
        width: 100%; height: 100%;
        aspect-ratio: unset;
        border-radius: 14px;
        background: #333;
        max-width: none;
      }
      #marketPadBottom { flex-shrink: 0; gap: 8px; }
      .pad-bottom button { min-height: 48px; }

      .rate-panel { flex: 1; min-height: 0; }
      .rate-frame-wrap { flex: 1; min-height: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="calculator">

    <!-- Mode Switch -->
    <section class="mode-switch">
      <button class="mode-btn active" id="calcModeBtn"   type="button">计算</button>
      <button class="mode-btn"        id="marketModeBtn" type="button">超市</button>
      <button class="mode-btn"        id="rateModeBtn"   type="button">汇率</button>
    </section>

    <!-- Display (hidden in rate mode) -->
    <section class="display" id="displaySection">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </section>

    <!-- Calculator Panel -->
    <section class="keys hidden" id="normalPanel">
      <!-- Row 1: Memory -->
      <button class="mem-btn" data-action="mc">MC</button>
      <button class="mem-btn" data-action="mplus">M+</button>
      <button class="mem-btn" data-action="mminus">M−</button>
      <button class="mem-btn" data-action="mr">MR</button>

      <!-- Row 2 -->
      <button class="danger" data-action="clear">AC</button>
      <button data-action="delete">⌫</button>
      <button data-action="sign">±</button>
      <button class="operator" data-value="/">÷</button>

      <!-- Row 3 -->
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <!-- Row 4 -->
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <!-- Row 5 -->
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <!-- Row 6 -->
      <button data-value="%">%</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>

    <!-- Market Panel -->
    <section class="market-panel hidden" id="marketPanel">
      <div class="market-row">
        <div class="market-field" style="grid-column:1/-1">
          <label for="mInputA">进价</label>
          <input class="panel-input" id="mInputA" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <div class="market-row">
        <div class="market-field">
          <label for="mInputB">IVA税 %</label>
          <input class="panel-input" id="mInputB" readonly inputmode="none" placeholder="点此输入" />
        </div>
        <div class="market-field">
          <label for="mInputProfit">利润 %</label>
          <input class="panel-input" id="mInputProfit" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <div class="market-row">
        <div class="market-field">
          <label for="mInputD1">折扣1 %</label>
          <input class="panel-input" id="mInputD1" readonly inputmode="none" placeholder="点此输入" />
        </div>
        <div class="market-field">
          <label for="mInputD2">折扣2 %</label>
          <input class="panel-input" id="mInputD2" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <!-- AC + 全部清除 -->
      <div class="pad-bottom" id="marketPadBottom">
        <button class="pad-ac-btn"  data-pad="ac">AC</button>
        <button class="pad-clr-btn" data-pad="clear-all">全部清除</button>
      </div>

      <!-- Number pad -->
      <div class="num-pad" id="marketNumPad">
        <button data-pad="7">7</button>
        <button data-pad="8">8</button>
        <button data-pad="9">9</button>

        <button data-pad="4">4</button>
        <button data-pad="5">5</button>
        <button data-pad="6">6</button>

        <button data-pad="1">1</button>
        <button data-pad="2">2</button>
        <button data-pad="3">3</button>

        <button data-pad=".">.</button>
        <button data-pad="0">0</button>
        <button class="pad-del" data-pad="del">⌫</button>
      </div>
    </section>

    <!-- Rate Panel -->
    <section class="rate-panel hidden" id="ratePanel">
      <div class="rate-frame-wrap">
        <div class="rate-loading" id="rateLoading">
          <div class="spinner"></div>
          <span>加载中...</span>
        </div>
        <div class="rate-error hidden" id="rateError">
          <p>该页面不允许嵌入显示。<br>请点击下方按钮在浏览器中查看。</p>
          <button class="open-browser-btn" id="openBrowserBtn">打开汇率页面</button>
        </div>
        <iframe id="rateIframe"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
      </div>
    </section>

  </main>

  <script>
    const RATE_URL = 'https://www.cronista.com/MercadosOnline/moneda/ARSB/';

    const calcEl        = document.querySelector('.calculator');
    const displaySection = document.getElementById('displaySection');
    const displayEl      = document.getElementById('display');
    const historyEl      = document.getElementById('history');
    const normalPanel    = document.getElementById('normalPanel');
    const marketPanel    = document.getElementById('marketPanel');
    const ratePanel      = document.getElementById('ratePanel');
    const calcModeBtn    = document.getElementById('calcModeBtn');
    const marketModeBtn  = document.getElementById('marketModeBtn');
    const rateModeBtn    = document.getElementById('rateModeBtn');
    const rateIframe     = document.getElementById('rateIframe');
    const rateLoading    = document.getElementById('rateLoading');
    const rateError      = document.getElementById('rateError');

    const mInputA      = document.getElementById('mInputA');
    const mInputB      = document.getElementById('mInputB');
    const mInputProfit = document.getElementById('mInputProfit');
    const mInputD1     = document.getElementById('mInputD1');
    const mInputD2     = document.getElementById('mInputD2');
    const marketInputs = [mInputA, mInputB, mInputProfit, mInputD1, mInputD2];

    let currentMode = 'calc';
    let expression  = '';
    let justCalcd   = false;
    let activeInput = null;
    let rateLoaded  = false;
    let memory      = 0;
    let hasMemory   = false;

    function fmt(v) {
      if (!Number.isFinite(v)) return 'Error';
      return String(parseFloat(v.toFixed(12)));
    }
    function evalExpr() {
      if (!expression) return 0;
      try {
        const r = Function('"use strict";return(' + fixPct(expression) + ')')();
        return Number.isFinite(r) ? r : 0;
      } catch { return 0; }
    }
    function toDisplayExpr(expr) {
      return expr.replace(/\*/g, '×').replace(/\//g, '÷');
    }
    function liveCalc(expr) {
      if (!expr) return '0';
      const clean = expr.replace(/[+\-*/]+$/, '');
      if (!clean) return '0';
      try {
        const r = Function('"use strict";return(' + fixPct(clean) + ')')();
        return Number.isFinite(r) ? fmt(r) : '0';
      } catch { return '0'; }
    }
    function updateMemVisual() {
      document.querySelectorAll('.mem-btn').forEach(b => {
        b.classList.toggle('has-mem', hasMemory);
      });
    }
    function parseField(el) {
      const s = el.value.trim();
      if (!s) return 0;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    /* Auto-shrink display font so numbers never break layout */
    function fitDisplay() {
      displayEl.style.fontSize = '';                           // reset to CSS value
      if (displayEl.scrollWidth <= displayEl.clientWidth) return; // fits — done
      const fs = parseFloat(getComputedStyle(displayEl).fontSize);
      const newFs = Math.max(16, fs * displayEl.clientWidth / displayEl.scrollWidth);
      displayEl.style.fontSize = newFs + 'px';
      // if still overflows at 16px, overflow:hidden clips silently without breaking layout
    }
    function setDisplay(text) {
      displayEl.textContent = text;
      fitDisplay();
    }

    function setMode(mode) {
      currentMode = mode;
      calcEl.dataset.mode = mode;
      calcModeBtn  .classList.toggle('active', mode === 'calc');
      marketModeBtn.classList.toggle('active', mode === 'market');
      rateModeBtn  .classList.toggle('active', mode === 'rate');
      normalPanel.classList.toggle('hidden', mode !== 'calc');
      marketPanel.classList.toggle('hidden', mode !== 'market');
      ratePanel  .classList.toggle('hidden', mode !== 'rate');
      displaySection.classList.toggle('hidden', mode === 'rate');

      if (mode === 'calc') {
        activeInput = null;
        updateDisplay();
      } else if (mode === 'market') {
        historyEl.textContent = '';
        setDisplay('0');
        setActiveInput(mInputA);
        recalcMarket();
      } else {
        if (!rateLoaded) {
          rateLoaded = true;
          rateIframe.src = RATE_URL;
          setTimeout(() => {
            if (!rateLoading.classList.contains('hidden')) {
              rateLoading.classList.add('hidden');
              rateError.classList.remove('hidden');
            }
          }, 18000);
        }
      }
    }

    function setActiveInput(el) {
      document.querySelectorAll('.panel-input').forEach(i => i.classList.remove('field-active'));
      activeInput = el;
      if (el) el.classList.add('field-active');
    }

    function padPress(key) {
      if (key === 'ac') {
        if (activeInput) activeInput.value = '';
        recalcMarket();
        return;
      }
      if (key === 'clear-all') {
        marketInputs.forEach(i => i.value = '');
        setActiveInput(mInputA);
        recalcMarket();
        return;
      }
      if (!activeInput) return;
      const cur = activeInput.value;
      if (key === 'del') {
        activeInput.value = cur.slice(0, -1);
      } else if (key === '.') {
        if (cur === '' || cur === '0') return;
        if (!cur.includes('.')) activeInput.value = cur + '.';
      } else {
        activeInput.value = (cur === '0') ? key : cur + key;
      }
      recalcMarket();
    }

    function updateDisplay() {
      historyEl.textContent = toDisplayExpr(expression);
      setDisplay(liveCalc(expression));
    }

    function appendValue(v) {
      if (justCalcd && /[0-9.]/.test(v)) expression = '';
      justCalcd = false;
      const last = expression.slice(-1);
      const ops  = ['+', '-', '*', '/', '%'];
      if (ops.includes(v)) {
        if (!expression && v !== '-') return;
        if (v === '%') {
          if (!/\d/.test(last) || last === '%') return;
          expression += v; updateDisplay(); return;
        }
        if (ops.includes(last) && last !== '%') expression = expression.slice(0, -1) + v;
        else expression += v;
        updateDisplay(); return;
      }
      if (v === '.') {
        const chunk = expression.split(/[+\-*/%]/).pop();
        if (chunk.includes('.') || chunk === '') return;
        expression += '.'; updateDisplay(); return;
      }
      expression += v; updateDisplay();
    }

    function clearAll() {
      expression = ''; historyEl.textContent = ''; justCalcd = false;
      setDisplay('0');
    }
    function deleteOne() {
      if (justCalcd) { clearAll(); return; }
      expression = expression.slice(0, -1); updateDisplay();
    }
    function toggleSign() {
      if (!expression) return;
      const m = expression.match(/(-?\d*\.?\d+)%?$/);
      if (!m) return;
      const full = m[0], hasPct = full.endsWith('%');
      const num  = hasPct ? full.slice(0, -1) : full;
      const tog  = num.startsWith('-') ? num.slice(1) : '-' + num;
      expression = expression.slice(0, m.index) + tog + (hasPct ? '%' : '');
      updateDisplay();
    }
    function fixPct(e) {
      let s = e;
      s = s.replace(/(\d+(?:\.\d+)?)\+(\d+(?:\.\d+)?)%/g, '($1*(1+$2/100))');
      s = s.replace(/(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)%/g,  '($1*(1-$2/100))');
      s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
      return s;
    }
    function calculate() {
      if (!expression) return;
      try {
        const r = Function('"use strict";return(' + fixPct(expression) + ')')();
        if (!Number.isFinite(r)) throw 0;
        historyEl.textContent = toDisplayExpr(expression) + ' =';
        expression = fmt(r);
        justCalcd  = true;
        setDisplay(expression);
      } catch {
        historyEl.textContent = '计算错误';
        setDisplay('Error');
        expression = ''; justCalcd = false;
      }
    }

    function recalcMarket() {
      if (!mInputA.value.trim()) {
        historyEl.textContent = ''; setDisplay('0'); return;
      }
      const a   = parseField(mInputA);
      const iva = parseField(mInputB);
      const pft = parseField(mInputProfit);
      const d1  = parseField(mInputD1);
      const d2  = parseField(mInputD2);
      if ([a, iva, pft, d1, d2].some(Number.isNaN)) { setDisplay('Error'); return; }
      const r = a * (1 - d1 / 100) * (1 - d2 / 100) * (1 + iva / 100) * (1 + pft / 100);
      historyEl.textContent = '';
      setDisplay(fmt(r));
    }

    rateIframe.addEventListener('load',  () => rateLoading.classList.add('hidden'));
    rateIframe.addEventListener('error', () => {
      rateLoading.classList.add('hidden');
      rateError.classList.remove('hidden');
    });
    document.getElementById('openBrowserBtn').addEventListener('click', () => {
      if (window.AndroidBridge) {
        window.AndroidBridge.openUrl(RATE_URL);
      } else {
        window.open(RATE_URL, '_blank');
      }
    });

    document.getElementById('normalPanel').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const { value: v, action: a } = b.dataset;
      if (v) appendValue(v);
      if (a === 'clear')  clearAll();
      if (a === 'delete') deleteOne();
      if (a === 'sign')   toggleSign();
      if (a === 'equals') calculate();
      if (a === 'mc')     { memory = 0; hasMemory = false; updateMemVisual(); }
      if (a === 'mplus')  { memory += evalExpr(); hasMemory = true; updateMemVisual(); }
      if (a === 'mminus') { memory -= evalExpr(); hasMemory = true; updateMemVisual(); }
      if (a === 'mr')     { if (hasMemory) { expression = fmt(memory); justCalcd = true; updateDisplay(); } }
    });

    ['marketNumPad', 'marketPadBottom'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        const b = e.target.closest('button[data-pad]');
        if (b) padPress(b.dataset.pad);
      });
    });

    marketInputs.forEach(inp => {
      inp.addEventListener('click',    ()  => setActiveInput(inp));
      inp.addEventListener('touchend', e  => { e.preventDefault(); setActiveInput(inp); });
    });

    calcModeBtn  .addEventListener('click', () => setMode('calc'));
    marketModeBtn.addEventListener('click', () => setMode('market'));
    rateModeBtn  .addEventListener('click', () => setMode('rate'));

    window.addEventListener('keydown', e => {
      if (currentMode !== 'calc') return;
      const k = e.key;
      if (/^[0-9]$/.test(k)) appendValue(k);
      else if (['+', '-', '*', '/', '%', '.'].includes(k)) appendValue(k);
      else if (k === 'Enter' || k === '=') calculate();
      else if (k === 'Backspace') deleteOne();
      else if (k === 'Escape')    clearAll();
    });

    setMode('calc');
  </script>
</body>
</html>
