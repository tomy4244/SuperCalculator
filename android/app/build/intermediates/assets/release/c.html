<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>超市计算器</title>
  <style>
    :root {
      --display: #1f2937;
      --field:   #0f172a;
      --key:     #374151;
      --key-hov: #4b5563;
      --accent:  #2563eb;
      --acc-hov: #3b82f6;
      --danger:  #dc2626;
      --dan-hov: #ef4444;
      --text:    #f9fafb;
      --muted:   #94a3b8;
      --border:  rgba(148,163,184,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; }

    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      background: linear-gradient(135deg,#020617,#0f172a 55%,#1e293b);
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                   "PingFang SC","Noto Sans SC",sans-serif;
      color: var(--text); padding: 20px;
      overflow-x: hidden;
    }

    .calculator {
      width: min(100%,420px);
      background: rgba(17,24,39,0.95);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    /* ── Mode Switch ── */
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 12px;
      flex-shrink: 0;
    }
    .mode-btn {
      min-height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.07); color: #9ca3af;
      border: none; font-size: 15px; font-weight: 600;
      cursor: pointer; line-height: 1;
      transition: background .18s, color .18s, font-size .18s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .mode-btn.active {
      background: rgba(255,255,255,0.92);
      color: #111827; font-size: 17px; font-weight: 800;
    }
    .mode-btn:not(.active):active { background: rgba(255,255,255,0.13); }

    /* ── Display ── */
    .display {
      background: var(--display); border-radius: 16px;
      padding: 14px 16px; margin-bottom: 12px;
      min-height: 130px; display: flex; flex-direction: column;
      justify-content: flex-end; gap: 4px;
      overflow: hidden; flex-shrink: 0;
      width: 100%; min-width: 0;
    }
    .history {
      text-align: right; color: var(--muted); font-size: 14px;
      min-height: 20px; white-space: nowrap; overflow: hidden;
      min-width: 0; width: 100%;
    }
    .current {
      text-align: right; font-size: 44px; font-weight: 700;
      line-height: 1.15; white-space: nowrap; overflow: hidden;
      min-width: 0; width: 100%;
    }

    .hidden { display: none !important; }

    /* ── Calc Keys ── */
    .keys {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
      width: 100%; min-width: 0;
    }
    button {
      border: none; border-radius: 16px; min-height: 58px;
      font-size: 22px; font-weight: 600; color: var(--text);
      background: var(--key); cursor: pointer;
      transition: transform .07s, background .14s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-width: 0; width: 100%;
    }
    button:active { transform: scale(0.96); }
    .keys button:not(.operator):not(.equals):not(.danger):not(.mem-btn):active { background: var(--key-hov); }

    /* Memory row */
    .mem-btn {
      background: rgba(255,255,255,0.06) !important;
      color: var(--muted) !important;
      font-size: 14px !important; font-weight: 700;
      min-height: 44px;
    }
    .mem-btn:active   { background: rgba(255,255,255,0.13) !important; transform: scale(0.96); }
    .mem-btn.has-mem  { color: var(--accent) !important; }

    .operator        { background: rgba(37,99,235,0.25); color: #93c5fd; }
    .operator:active { background: rgba(37,99,235,0.45); }
    .equals          { background: #059669; color: #fff; font-size: 26px; }
    .equals:active   { background: #047857; }
    .danger          { background: var(--danger); }
    .danger:active   { background: var(--dan-hov); }

    /* ── Market panel ── */
    .market-panel { display: flex; flex-direction: column; gap: 9px; overflow: hidden; width: 100%; min-width: 0; }
    .market-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; width: 100%; min-width: 0; }
    .market-field { display: flex; flex-direction: column; gap: 4px; }
    .market-field label {
      font-size: 12px; color: var(--muted); font-weight: 600;
      display: flex; align-items: center; gap: 4px; padding-left: 2px;
    }
    .panel-input {
      width: 100%; min-height: 46px; min-width: 0;
      border: 1.5px solid var(--border);
      background: var(--field); color: var(--text);
      border-radius: 12px; padding: 0 12px;
      font-size: 19px; font-weight: 600; outline: none;
      caret-color: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .panel-input.field-active {
      border-color: rgba(59,130,246,0.8);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
    }
    .tooltip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(148,163,184,0.22); font-size: 10px;
      cursor: help; position: relative;
    }
    .tooltip::after {
      content: attr(data-tip);
      position: absolute; left: 50%; bottom: calc(100% + 6px);
      transform: translateX(-50%); width: 150px;
      padding: 6px 8px; border-radius: 8px; background: #0b1220;
      color: var(--text); font-size: 11px; line-height: 1.4;
      border: 1px solid var(--border); opacity: 0;
      pointer-events: none; transition: opacity .15s;
      z-index: 10; text-align: left; white-space: normal;
    }
    .tooltip:active::after { opacity: 1; }

    /* ── Number Pad ── */
    .num-pad {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 8px;
    }
    .num-pad button {
      min-height: 52px; font-size: 20px; border-radius: 14px;
      background: var(--key); color: var(--text);
    }
    .num-pad button:active { background: var(--key-hov); }
    .pad-del { font-size: 22px; }

    /* ── Market bottom row ── */
    .pad-bottom {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pad-bottom button {
      min-height: 48px; font-size: 17px; border-radius: 14px;
    }
    .pad-ac-btn   { background: var(--danger) !important; }
    .pad-ac-btn:active   { background: var(--dan-hov) !important; }
    .pad-clr-btn  { background: #374151 !important; }
    .pad-clr-btn:active  { background: var(--key-hov) !important; }

    /* ── Rate panel ── */
    .rate-panel {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }
    .rate-frame-wrap {
      flex: 1; min-height: 420px; position: relative;
      border-radius: 14px; overflow: hidden; background: #fff;
    }
    #rateIframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; }
    .rate-loading {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: var(--display); color: var(--muted); font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rate-error {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--display); padding: 24px; text-align: center;
    }
    .rate-error p { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .open-browser-btn {
      background: var(--accent); color: #fff;
      border: none; border-radius: 14px;
      padding: 14px 28px; font-size: 17px; font-weight: 700;
      cursor: pointer; min-height: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .open-browser-btn:active { background: var(--acc-hov); }

    /* ── Mobile: fill entire screen ── */
    @media (max-width: 480px) {
      body { padding: 0; place-items: start stretch; }

      .calculator {
        width: 100%;
        height: 100vh; height: 100dvh;
        border-radius: 0; border: none;
        padding: 14px 14px 16px;
        display: flex; flex-direction: column;
      }

      .mode-btn { min-height: 46px; }

      .display  { height: 148px; min-height: 0; flex-shrink: 0; }
      .current  { font-size: 52px; }

      .keys {
        flex: 1; min-height: 0;
        grid-template-rows: repeat(6, 1fr);
      }
      .keys button { min-height: 0; height: 100%; }
      .mem-btn { min-height: 0; }

      .market-panel { flex: 1; min-height: 0; gap: 6px; }
      .market-row   { flex-shrink: 0; }
      .panel-input  { min-height: 46px; }

      #marketNumPad {
        flex: 1; min-height: 0;
        grid-template-rows: repeat(4, 1fr);
        margin-top: 0;
      }
      #marketNumPad button { min-height: 0; height: 100%; }
      #marketPadBottom     { flex-shrink: 0; }
      .pad-bottom button   { min-height: 48px; }

      .rate-panel      { flex: 1; min-height: 0; }
      .rate-frame-wrap { flex: 1; min-height: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="calculator">

    <!-- Mode Switch -->
    <section class="mode-switch">
      <button class="mode-btn active" id="calcModeBtn"   type="button">计算</button>
      <button class="mode-btn"        id="marketModeBtn" type="button">超市</button>
      <button class="mode-btn"        id="rateModeBtn"   type="button">汇率</button>
    </section>

    <!-- Display (hidden in rate mode) -->
    <section class="display" id="displaySection">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </section>

    <!-- Calculator Panel -->
    <section class="keys hidden" id="normalPanel">
      <!-- Row 1: Memory -->
      <button class="mem-btn" data-action="mc">MC</button>
      <button class="mem-btn" data-action="mplus">M+</button>
      <button class="mem-btn" data-action="mminus">M−</button>
      <button class="mem-btn" data-action="mr">MR</button>

      <!-- Row 2 -->
      <button class="danger" data-action="clear">AC</button>
      <button data-action="delete">⌫</button>
      <button data-action="sign">±</button>
      <button class="operator" data-value="/">÷</button>

      <!-- Row 3 -->
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <!-- Row 4 -->
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <!-- Row 5 -->
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <!-- Row 6 -->
      <button data-value="%">%</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>

    <!-- Market Panel -->
    <section class="market-panel hidden" id="marketPanel">
      <div class="market-row">
        <div class="market-field" style="grid-column:1/-1">
          <label for="mInputA">进价</label>
          <input class="panel-input" id="mInputA" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <div class="market-row">
        <div class="market-field">
          <label for="mInputB">IVA税 %</label>
          <input class="panel-input" id="mInputB" readonly inputmode="none" placeholder="点此输入" />
        </div>
        <div class="market-field">
          <label for="mInputProfit">利润 %</label>
          <input class="panel-input" id="mInputProfit" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <div class="market-row">
        <div class="market-field">
          <label for="mInputD1">折扣一 %</label>
          <input class="panel-input" id="mInputD1" readonly inputmode="none" placeholder="点此输入" />
        </div>
        <div class="market-field">
          <label for="mInputD2">折扣二 %</label>
          <input class="panel-input" id="mInputD2" readonly inputmode="none" placeholder="点此输入" />
        </div>
      </div>

      <!-- Top row: AC (clear active field) + 全部清除 -->
      <div class="pad-bottom" id="marketPadBottom">
        <button class="pad-ac-btn"  data-pad="ac">AC</button>
        <button class="pad-clr-btn" data-pad="clear-all">全部清除</button>
      </div>

      <!-- Number pad -->
      <div class="num-pad" id="marketNumPad">
        <button data-pad="7">7</button>
        <button data-pad="8">8</button>
        <button data-pad="9">9</button>

        <button data-pad="4">4</button>
        <button data-pad="5">5</button>
        <button data-pad="6">6</button>

        <button data-pad="1">1</button>
        <button data-pad="2">2</button>
        <button data-pad="3">3</button>

        <button data-pad=".">.</button>
        <button data-pad="0">0</button>
        <button class="pad-del" data-pad="del">⌫</button>
      </div>
    </section>

    <!-- Rate Panel -->
    <section class="rate-panel hidden" id="ratePanel">
      <div class="rate-frame-wrap">
        <div class="rate-loading" id="rateLoading">
          <div class="spinner"></div>
          <span>加载中...</span>
        </div>
        <div class="rate-error hidden" id="rateError">
          <p>该页面不允许嵌入显示。<br>请点击下方按钮在浏览器中查看。</p>
          <button class="open-browser-btn" id="openBrowserBtn">打开汇率页面</button>
        </div>
        <iframe id="rateIframe"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
      </div>
    </section>

  </main>

  <script>
    const RATE_URL = 'https://www.cronista.com/MercadosOnline/moneda/ARSB/';

    const displaySection = document.getElementById('displaySection');
    const displayEl      = document.getElementById('display');
    const historyEl      = document.getElementById('history');
    const normalPanel    = document.getElementById('normalPanel');
    const marketPanel    = document.getElementById('marketPanel');
    const ratePanel      = document.getElementById('ratePanel');
    const calcModeBtn    = document.getElementById('calcModeBtn');
    const marketModeBtn  = document.getElementById('marketModeBtn');
    const rateModeBtn    = document.getElementById('rateModeBtn');
    const rateIframe     = document.getElementById('rateIframe');
    const rateLoading    = document.getElementById('rateLoading');
    const rateError      = document.getElementById('rateError');

    const mInputA      = document.getElementById('mInputA');
    const mInputB      = document.getElementById('mInputB');
    const mInputProfit = document.getElementById('mInputProfit');
    const mInputD1     = document.getElementById('mInputD1');
    const mInputD2     = document.getElementById('mInputD2');
    const marketInputs = [mInputA, mInputB, mInputProfit, mInputD1, mInputD2];

    let currentMode = 'calc';
    let expression  = '';
    let justCalcd   = false;
    let activeInput = null;
    let rateLoaded  = false;
    let memory      = 0;
    let hasMemory   = false;

    function fmt(v) {
      if (!Number.isFinite(v)) return 'Error';
      return String(parseFloat(v.toFixed(12)));
    }
    function evalExpr() {
      if (!expression) return 0;
      try {
        const r = Function('"use strict";return(' + fixPct(expression) + ')')();
        return Number.isFinite(r) ? r : 0;
      } catch { return 0; }
    }
    function toDisplayExpr(expr) {
      return expr.replace(/\*/g, '×').replace(/\//g, '÷');
    }
    function liveCalc(expr) {
      if (!expr) return '0';
      // Strip trailing pure operators but keep trailing % — it's part of the value
      const clean = expr.replace(/[+\-*/]+$/, '');
      if (!clean) return '0';
      try {
        const r = Function('"use strict";return(' + fixPct(clean) + ')')();
        return Number.isFinite(r) ? fmt(r) : '0';
      } catch { return '0'; }
    }
    function updateMemVisual() {
      document.querySelectorAll('.mem-btn').forEach(b => {
        b.classList.toggle('has-mem', hasMemory);
      });
    }
    function parseField(el) {
      const s = el.value.trim();
      if (!s) return 0;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function setMode(mode) {
      currentMode = mode;
      calcModeBtn  .classList.toggle('active', mode === 'calc');
      marketModeBtn.classList.toggle('active', mode === 'market');
      rateModeBtn  .classList.toggle('active', mode === 'rate');
      normalPanel.classList.toggle('hidden', mode !== 'calc');
      marketPanel.classList.toggle('hidden', mode !== 'market');
      ratePanel  .classList.toggle('hidden', mode !== 'rate');
      displaySection.classList.toggle('hidden', mode === 'rate');

      if (mode === 'calc') {
        activeInput = null;
        updateDisplay();
      } else if (mode === 'market') {
        historyEl.textContent = '';
        displayEl.textContent = '0';
        setActiveInput(mInputA);
        recalcMarket();
      } else {
        if (!rateLoaded) {
          rateLoaded = true;
          rateIframe.src = RATE_URL;
          setTimeout(() => {
            if (!rateLoading.classList.contains('hidden')) {
              rateLoading.classList.add('hidden');
              rateError.classList.remove('hidden');
            }
          }, 18000);
        }
      }
    }

    function setActiveInput(el) {
      document.querySelectorAll('.panel-input').forEach(i => i.classList.remove('field-active'));
      activeInput = el;
      if (el) el.classList.add('field-active');
    }

    function padPress(key) {
      if (key === 'ac') {
        if (activeInput) activeInput.value = '';
        recalcMarket();
        return;
      }
      if (key === 'clear-all') {
        marketInputs.forEach(i => i.value = '');
        setActiveInput(mInputA);
        recalcMarket();
        return;
      }
      if (!activeInput) return;
      const cur = activeInput.value;
      if (key === 'del') {
        activeInput.value = cur.slice(0, -1);
      } else if (key === '.') {
        if (cur === '' || cur === '0') return;
        if (!cur.includes('.')) activeInput.value = cur + '.';
      } else {
        activeInput.value = (cur === '0') ? key : cur + key;
      }
      recalcMarket();
    }

    function updateDisplay() {
      historyEl.textContent = toDisplayExpr(expression);
      displayEl.textContent = liveCalc(expression);
    }

    function appendValue(v) {
      if (justCalcd && /[0-9.]/.test(v)) expression = '';
      justCalcd = false;
      const last = expression.slice(-1);
      const ops  = ['+', '-', '*', '/', '%'];
      if (ops.includes(v)) {
        if (!expression && v !== '-') return;
        if (v === '%') {
          if (!/\d/.test(last) || last === '%') return;
          expression += v; updateDisplay(); return;
        }
        if (ops.includes(last) && last !== '%') expression = expression.slice(0, -1) + v;
        else expression += v;
        updateDisplay(); return;
      }
      if (v === '.') {
        const chunk = expression.split(/[+\-*/%]/).pop();
        if (chunk.includes('.') || chunk === '') return;
        expression += '.'; updateDisplay(); return;
      }
      expression += v; updateDisplay();
    }

    function clearAll() {
      expression = ''; historyEl.textContent = ''; justCalcd = false;
      displayEl.textContent = '0';
    }
    function deleteOne() {
      if (justCalcd) { clearAll(); return; }
      expression = expression.slice(0, -1); updateDisplay();
    }
    function toggleSign() {
      if (!expression) return;
      const m = expression.match(/(-?\d*\.?\d+)%?$/);
      if (!m) return;
      const full = m[0], hasPct = full.endsWith('%');
      const num  = hasPct ? full.slice(0, -1) : full;
      const tog  = num.startsWith('-') ? num.slice(1) : '-' + num;
      expression = expression.slice(0, m.index) + tog + (hasPct ? '%' : '');
      updateDisplay();
    }
    function fixPct(e) {
      let s = e;
      s = s.replace(/(\d+(?:\.\d+)?)\+(\d+(?:\.\d+)?)%/g, '($1*(1+$2/100))');
      s = s.replace(/(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)%/g,  '($1*(1-$2/100))');
      s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
      return s;
    }
    function calculate() {
      if (!expression) return;
      try {
        const r = Function('"use strict";return(' + fixPct(expression) + ')')();
        if (!Number.isFinite(r)) throw 0;
        historyEl.textContent = toDisplayExpr(expression) + ' =';
        expression = fmt(r);
        justCalcd  = true;
        displayEl.textContent = expression;
      } catch {
        historyEl.textContent = '计算错误';
        displayEl.textContent = 'Error';
        expression = ''; justCalcd = false;
      }
    }

    function recalcMarket() {
      if (!mInputA.value.trim()) {
        historyEl.textContent = ''; displayEl.textContent = '0'; return;
      }
      const a   = parseField(mInputA);
      const iva = parseField(mInputB);
      const pft = parseField(mInputProfit);
      const d1  = parseField(mInputD1);
      const d2  = parseField(mInputD2);
      if ([a, iva, pft, d1, d2].some(Number.isNaN)) { displayEl.textContent = 'Error'; return; }
      const r = a * (1 - d1 / 100) * (1 - d2 / 100) * (1 + iva / 100) * (1 + pft / 100);
      historyEl.textContent = '';
      displayEl.textContent = fmt(r);
    }

    rateIframe.addEventListener('load',  () => rateLoading.classList.add('hidden'));
    rateIframe.addEventListener('error', () => {
      rateLoading.classList.add('hidden');
      rateError.classList.remove('hidden');
    });
    document.getElementById('openBrowserBtn').addEventListener('click', () => {
      /* Android WebView bridge — falls back to window.open on desktop */
      if (window.AndroidBridge) {
        window.AndroidBridge.openUrl(RATE_URL);
      } else {
        window.open(RATE_URL, '_blank');
      }
    });

    document.getElementById('normalPanel').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const { value: v, action: a } = b.dataset;
      if (v) appendValue(v);
      if (a === 'clear')  clearAll();
      if (a === 'delete') deleteOne();
      if (a === 'sign')   toggleSign();
      if (a === 'equals') calculate();
      if (a === 'mc')     { memory = 0; hasMemory = false; updateMemVisual(); }
      if (a === 'mplus')  { memory += evalExpr(); hasMemory = true; updateMemVisual(); }
      if (a === 'mminus') { memory -= evalExpr(); hasMemory = true; updateMemVisual(); }
      if (a === 'mr')     { if (hasMemory) { expression = fmt(memory); justCalcd = true; updateDisplay(); } }
    });

    ['marketNumPad', 'marketPadBottom'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        const b = e.target.closest('button[data-pad]');
        if (b) padPress(b.dataset.pad);
      });
    });

    marketInputs.forEach(inp => {
      inp.addEventListener('click',    ()  => setActiveInput(inp));
      inp.addEventListener('touchend', e  => { e.preventDefault(); setActiveInput(inp); });
    });

    calcModeBtn  .addEventListener('click', () => setMode('calc'));
    marketModeBtn.addEventListener('click', () => setMode('market'));
    rateModeBtn  .addEventListener('click', () => setMode('rate'));

    window.addEventListener('keydown', e => {
      if (currentMode !== 'calc') return;
      const k = e.key;
      if (/^[0-9]$/.test(k)) appendValue(k);
      else if (['+', '-', '*', '/', '%', '.'].includes(k)) appendValue(k);
      else if (k === 'Enter' || k === '=') calculate();
      else if (k === 'Backspace') deleteOne();
      else if (k === 'Escape')    clearAll();
    });

    setMode('calc');
  </script>
</body>
</html>
